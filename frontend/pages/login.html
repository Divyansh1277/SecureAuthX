<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to SecureAuthX – Multi-layer authentication system.">
  <title>Sign In – SecureAuthX</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" href="/assets/logo.png">
</head>

<body>
  <div class="toast-container" id="toastContainer"></div>
  <div class="spinner-overlay" id="spinnerOverlay">
    <div class="flex flex-col items-center">
      <div class="spinner"></div>
      <p class="spinner-text">Authenticating...</p>
    </div>
  </div>

  <div class="auth-layout">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon" style="background: transparent; box-shadow: none;">
          <img src="/assets/logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <span class="auth-logo-text">SecureAuthX</span>
      </div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Enter your credentials to access your account</p>

      <!-- Account Lock UI -->
      <div class="lock-countdown hidden" id="lockCountdown">
        <div class="lock-countdown-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--danger-500)" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>
        <p class="lock-countdown-text">Account temporarily locked</p>
        <div class="lock-countdown-timer" id="lockTimer">--:--</div>
        <p class="lock-countdown-text">Too many failed attempts. Please wait.</p>
      </div>

      <!-- Attempt Warning -->
      <div id="attemptWarning" class="hidden"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="username">Username or Email</label>
          <div class="input-group">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input type="text" id="username" name="username" class="form-input" placeholder="Enter username or email"
              required autocomplete="username" maxlength="254">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password"
              required autocomplete="current-password" maxlength="128">
            <button type="button" class="input-toggle" id="togglePassword" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="flex justify-between items-center mb-6">
          <div class="checkbox-group">
            <input type="checkbox" id="remember" class="checkbox-input">
            <label for="remember" class="checkbox-label">Remember me</label>
          </div>
          <a href="/forgot-password" style="font-size: 0.8125rem; color: var(--primary-500); text-decoration: none; font-weight: 500;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-full btn-lg" id="loginBtn">
          Sign In
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/signup">Create one</a>
      </div>
      <div style="text-align: center; margin-top: 12px;">
        <a href="/" style="font-size: 0.8125rem; color: var(--text-tertiary);">← Back to Home</a>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('authToken');
      const user = JSON.parse(localStorage.getItem('authUser') || 'null');
      if (token && user) {
        window.location.href = user.role === 'admin' ? '/admin' : '/dashboard';
        return;
      }
      initLoginPage();
    });
  </script>
</body>

</html>
