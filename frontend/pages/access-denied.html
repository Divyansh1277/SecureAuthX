<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied – SecureAuthX</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" href="/assets/logo.png">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-card" style="text-align: center;">
      <div style="animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);">
        <div style="margin-bottom: 16px; opacity: 0.8; color: var(--danger-400);"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></div>
        <div style="font-size: 4rem; font-weight: 900; color: var(--danger-500); letter-spacing: -0.04em; margin-bottom: 8px;">403</div>
        <h1 style="font-size: 1.375rem; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;">Access Denied</h1>
        <p style="font-size: 0.9375rem; color: var(--text-secondary); margin-bottom: 32px; line-height: 1.6;">
          You don't have permission to access this resource.<br>
          Please contact your administrator if you believe this is an error.
        </p>
        <div class="flex flex-col gap-3">
          <a href="/login" class="btn btn-primary btn-lg w-full">
            Return to Login
          </a>
          <a href="/" class="btn btn-secondary w-full">
            Go to Home
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
